<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Інтерактивна Ономастична Мережа Імен</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#060814;--tx:#e8ecff;--mu:#9aa6d0;--gl:rgba(255,255,255,.07);--bd:rgba(130,150,255,.35);--ca:rgba(255,255,255,.06);--dr:rgba(8,12,28,.86);--c:#6c7bff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:light){:root:not([data-th="dark"]){}}
[data-th=light]{--bg:#f4f6fb;--tx:#16204a;--mu:#52608f;--gl:rgba(255,255,255,.75);--bd:rgba(30,60,160,.28);--ca:rgba(255,255,255,.9);--dr:rgba(244,246,251,.94)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 Inter,system-ui,sans-serif;overflow:hidden;height:100%;transition:background .4s}
html{height:100%}
#bg{position:fixed;inset:0;z-index:0}
header{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:0;right:0;z-index:20;display:flex;flex-direction:column;align-items:center;gap:7px;padding:0 8px}
.pill{padding:10px 20px;border-radius:99px;background:var(--gl);border:1px solid var(--bd);backdrop-filter:blur(18px);box-shadow:0 6px 30px rgba(80,100,255,.2);font-size:clamp(11px,2.3vw,15px)}
.pill b{font:800 1.1em Unbounded,Inter,sans-serif;background:linear-gradient(90deg,#4cc9f0,#8a6cff,#2de2c3);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;align-items:center}
.bar button,.bar input{font:500 12px Inter;padding:7px 13px;border-radius:99px;border:1px solid var(--bd);background:var(--gl);color:var(--tx);backdrop-filter:blur(12px);cursor:pointer;outline:none}
.bar input{cursor:text;width:min(220px,60vw)}
.bar button.on{background:linear-gradient(90deg,#4cc9f0,#8a6cff);color:#fff;border-color:transparent}
#nm{position:fixed;top:calc(118px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-20px);z-index:25;width:min(94vw,640px);padding:14px;border-radius:22px;background:var(--dr);border:1px solid var(--bd);backdrop-filter:blur(22px);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;opacity:0;pointer-events:none;transition:.35s}
#nm.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#nm button{font:500 13px Inter;padding:8px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--ca);color:var(--tx);cursor:pointer}
#nm button.on{background:var(--c);color:#fff}
#stage{position:fixed;inset:0;z-index:5;cursor:grab;touch-action:none}
#world{position:absolute;left:50%;top:50%;width:0;height:0}
#lines{position:absolute;left:-600px;top:-600px;width:1200px;height:1200px;overflow:visible;pointer-events:none}
.ln{fill:none;stroke-width:2;opacity:0;transition:opacity .6s}
.open .ln{opacity:.6}.ln.act{opacity:1!important;stroke-width:4;filter:drop-shadow(0 0 6px currentColor)}
.pl{fill:none;stroke:var(--tx);stroke-width:3;stroke-dasharray:6 200;stroke-linecap:round;animation:run 2.2s linear infinite}
@keyframes run{to{stroke-dashoffset:-206}}
#orb{position:absolute;left:-105px;top:-105px;width:210px;height:210px;display:grid;place-items:center;text-align:center;cursor:pointer;z-index:3;transition:filter .6s}
#orb i{position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,#fff8,var(--c) 45%,#12063a);box-shadow:0 0 40px var(--c),0 0 90px var(--c),inset 0 0 36px rgba(255,255,255,.4);animation:mo 9s ease-in-out infinite,pu 3s ease-in-out infinite;filter:url(#wob);transition:background .6s,box-shadow .6s}
#orb i:nth-child(2){inset:-14px;opacity:.4;animation-duration:12s,4s;animation-direction:reverse;box-shadow:none;background:radial-gradient(circle,var(--c),transparent 70%)}
@keyframes mo{0%,100%{border-radius:60% 40% 30% 70%/60% 30% 70% 40%}25%{border-radius:30% 60% 70% 40%/50% 60% 30% 60%}50%{border-radius:50% 60% 30% 60%/30% 60% 70% 40%}75%{border-radius:40% 30% 60% 50%/60% 40% 50% 40%}}
@keyframes pu{50%{transform:scale(1.07)}}
#orb div{position:relative;z-index:2;font:800 23px Unbounded;letter-spacing:2px;color:#fff;text-shadow:0 0 14px rgba(0,0,0,.4)}
#orb small{display:block;font:500 10px Inter;letter-spacing:0;padding:0 24px;margin-top:2px}
.rip{position:absolute;left:-105px;top:-105px;width:210px;height:210px;border-radius:50%;border:2px solid var(--c);animation:rp 1.2s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(4.5);opacity:0}}
.nd{position:absolute;width:156px;margin:-34px 0 0 -78px;padding:10px;text-align:center;border-radius:18px;font:600 12px/1.3 Inter;background:var(--gl);border:1px solid var(--c);backdrop-filter:blur(14px);box-shadow:0 0 18px color-mix(in srgb,var(--c) 50%,transparent);cursor:pointer;transition:left .9s cubic-bezier(.2,1.4,.4,1),top .9s cubic-bezier(.2,1.4,.4,1),transform .2s,opacity .5s;opacity:0;z-index:2}
.nd span{display:block;font-size:20px;color:var(--c)}
.open .nd{opacity:1}.nd:hover,.nd.act{transform:scale(1.1)}
#back{position:fixed;left:50%;bottom:calc(46px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:12;display:none;font:600 13px Inter;padding:10px 20px;border-radius:99px;border:1px solid var(--c);background:var(--gl);backdrop-filter:blur(14px);color:var(--tx);cursor:pointer;box-shadow:0 0 20px var(--c)}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(100vw,560px);z-index:30;transform:translateX(105%);transition:transform .5s cubic-bezier(.2,.9,.3,1);background:var(--dr);backdrop-filter:blur(24px);border-left:1px solid var(--bd);overflow:auto;padding:70px 18px 30px}
#dr.show{transform:none}
#enc{position:fixed;inset:0;z-index:15;overflow:auto;padding:150px 16px 40px;display:none;background:color-mix(in srgb,var(--bg) 70%,transparent)}
#enc>div{max-width:980px;margin:auto}
h2{font:800 18px Unbounded;margin:22px 0 10px;color:var(--c)}
h1{font:800 26px Unbounded;margin:30px 0 0;color:var(--tx)}
.card{padding:14px 16px;margin:0 0 10px;border-radius:16px;background:var(--ca);border:1px solid var(--bd);border-left:3px solid var(--c)}
.card h3{margin:0 0 4px;font:600 15px Inter}.card p{margin:0;color:var(--mu);font-size:14px}
mark{background:#ffd166;color:#000;border-radius:3px}
#x{position:absolute;top:16px;right:16px;border:0;background:var(--gl);color:var(--tx);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
#hint{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:var(--mu);font-size:12px;z-index:10;pointer-events:none}
</style></head><body data-th="dark">
<canvas id="bg"></canvas>
<svg width="0" height="0" style="position:absolute"><filter id="wob"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="2" result="n"><animate attributeName="baseFrequency" dur="10s" values=".012;.022;.012" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="24"/></filter></svg>
<header><div class="pill">◈ Дослідницький проєкт • Робота <b>Мухи Мілани</b></div>
<div class="bar"><button id="v1" class="on">⬡ Інтерактивна Карта Гілок</button><button id="v2">◈ Повна Енциклопедія (Усі тексти)</button><button id="th">✧ Світла тема</button><input id="gq" placeholder="Миттєвий пошук по базі…"></div></header>
<div id="nm"></div>
<div id="stage"><div id="world"><svg id="lines" viewBox="-600 -600 1200 1200"></svg><div id="orb"><i></i><i></i><div id="on">МІЛАНА</div><small id="os"></small></div></div></div>
<button id="back">◈ Повернутися до головного ядра: МІЛАНА</button>
<div id="enc"><div id="ec"></div></div>
<aside id="dr"><button id="x">✕</button><div id="dc"></div></aside>
<div id="hint">Тягни мишкою / пальцем • коліщатко або щипок — масштаб</div>
<script>
const B=(t,g,it)=>({t,g,it});
const N={};
N.danylo={n:"ДАНИЛО",s:"Бог — мій суддя • Натисни, щоб розкрити гілки • Рід Малов",c:"#6c7bff",br:[
B("Етимологія та Світові форми","◈",[
["Первинний біблійний та фонетичний код","Від давньоєврейського «Даніель» (דָּנִיֵּאל — Dāniyyēl): «дан» (דָּן) — судити, вершити правосуддя, встановлювати істину; «ель» (אֵל) — Бог, Вища Сила, Творець. Переклад: «Бог — мій суддя», «Бог є моїм правосуддям», «Той, хто судить за правдою Божою». Через Септуагінту ім’я увійшло в Європу як Δανιήλ (Даніель / Даниїл), у латині — Danielus."],
["Українська мовна еволюція та форми","Після хрещення Русі (988) ім’я поширилося як церковнослов’янське «Даниїл», а жива мова створила народну форму на «-о» — Данило (як Кирило, Михайло, Гаврило, Павло, Самійло). Кличний: Даниле! Пестливі: Даня, Данько, Данилко, Данилечко, Данчик, Даник, Данюша, Данусь, Дан. По батькові: Данилович, Данилівна. Прізвища: Даниленко, Данилюк, Данилів, Данильченко, Данилевич, Данилко, Данько, Данилишин, Даниляк, Данильчук, Данилейко."],
["Світова карта імені (70+ країн і культур)","Англосфера: Daniel (Деніел), Dan, Danny. Романський світ: Danilo, Daniele, Daniel. Германський і скандинавський: Daniel, Daan (Нідерланди), Taneli (Фінляндія), Tanel (Естонія). Слов’янські: Данило, Данила / Даниил, Danilo (Сербія, Хорватія, Чорногорія, Словенія), Daniel (Польща, Чехія, Словаччина), Данаил (Болгарія). Близький Схід і Азія: Даніял / Daniyal, Данел (Грузія), Даніел (Вірменія). Кельтська традиція: Deiniol (Уельс; собор у Бангорі)."]]),
B("Історія та спадщина прізвища МАЛОВ","❖",[
["Походження: чотири версії","1) Охоронна: молодшого чи улюбленого сина називали «Малий» / «Малой», а нащадки — Малов («син Малого»); такі «Малі» часто ставали велетнями духу й полководцями. 2) Княжа древлянська: корінь «Мал-» від князя Мала (X ст., Іскоростень / Коростень), звідси й Малин. 3) Латинсько-європейська: malleus — молот, символ ковалів і зброярів, що перегукується із залізом — Ferrum. 4) Топонімічна: Мала Виска, Малів, Малинівка."],
["Синергія «Данило Малов»","«Данило» — енергія справедливого суду, королівської мудрості, лідерства. «Малов» — динамічність, практична хватка, підприємницький талант, інженерна винахідливість, незламність роду. Разом — архетип «Архітектора майбутнього»: повага до традицій, високі технології, бізнес і творчість."],
["Антон Малов (Антон Феррум)","Український підприємець із Кривого Рогу, засновник і керівник групи компаній «Ferrum»."],
["Сергій Юхимович Малов (1880–1957)","Лінгвіст-сходознавець, тюрколог, дешифрувальник рунічних пам’яток Єнісею та Орхону, автор словників давніх мов."],
["Микола Миколайович Малов (1902–1986)","Фізик-радіофізик, професор, дослідник електромагнітних хвиль і оптики, автор підручників."],
["Олексій та Володимир Малов","Олексій — інженер-конструктор і винахідник (металургія, машинобудування, автоматизація). Володимир — автор науково-популярних книг про географічні відкриття, експедиції, авіацію."],
["Топоніми","Село Малове (Одещина), село Малів (Рівненщина, відоме з XVI ст.), мис Малова в Арктиці."]]),
B("Історичні Правителі та Полководці","✦",[
["Пророк Даниїл (VI ст. до н. е.)","Старозавітний пророк царського роду, мудрець Вавилону, радник Навуходоносора, Валтасара, Дарія й Кіра. Неушкодженим вийшов із рову з левами; прочитав «Мене, Мене, Текел, Уфарсін» — «Пораховано, зважено і розділено твоє царство»."],
["Король Данило Романович Галицький (1201–1264)","Син Романа Мстиславича та візантійської принцеси Анни. Сирота у 4 роки, вигнанець в Угорщині й Польщі, повернув престол, об’єднав Волинь, Галичину й Київ (1239). 1238: розгром тевтонців під Дорогочином — «Не личить тримати нашу батьківщину крижевникам!». 1245: перемога під Ярославом. 1253: коронація в Дорогочині від легата Інокентія IV — перший Король Русі (Rex Russiae). Заснував Львів (1256, на честь сина Лева), зробив столицею Холм, укріпив Кременець, Данилів, Стіжок."],
["Ігумен Данило (Даниїл Паломник)","Чернігівський чернець і дипломат; 1106–1108 — подорож через Константинополь і Егейські острови до Єрусалима, прийнятий королем Балдуїном I, поставив лампаду на Гробі Господньому «від усієї Руської землі». «Житіє і ходіння Данила» — перший бестселер давньоукраїнської літератури."],
["Данило Острозький (XIV ст.)","Князь, володар Острога, будівничий Вежі Мурованої, засновник роду Острозьких — трьох століть меценатства української культури, освіти й війська."],
["Данило Нечай (бл. 1612–1651) — Козацький Ахіллес","Брацлавський полковник, один із найталановитіших полководців під проводом Хмельницького: Жовті Води, Корсунь, Пилявці, Львів, Замостя. Символ безстрашного лицаря, про якого складено десятки пісень."],
["Данило Виговський (†1659)","Бихівський полковник, наказний гетьман, брат Івана Виговського, чоловік Олени Хмельницької. Керував обороною та визволенням Києва й Білої Русі."],
["Данило Братковський (бл. 1642–1702)","Волинський шляхтич, підстолій венденський, поет-сатирик, автор «Світ, по частинах розглянутий» (Краків, 1697). Святий мученик Данило Волинський (Луцький)."],
["Гетьман Данило Апостол (1654–1734) — Великий Реформатор","Миргородський полковник 45 років, гетьман Лівобережжя (1727–1734). Азовські походи, Північна війна, Перський похід (втратив око). Перший державний бюджет Гетьманщини, відокремлення державних коштів від приватних, судова інструкція з апеляцією (1730), повернення олешківських козаків, підтримка торгівлі й Києво-Могилянської академії."],
["Данило Кушнір (†1766)","Староста церкви в Млієві, захисник православної громади перед Коліївщиною, оспіваний Шевченком у «Гайдамаках»."],
["Данило Терпило — Отаман Зелений (1886–1919)","Ватажок селянсько-повстанського руху на Київщині й Подніпров’ї 1918–1919: 30-тисячна Дніпровська дивізія, флотилія на Дніпрі, столиця в Трипіллі."],
["Гетьманич Данило Скоропадський (1904–1957)","Син гетьмана Павла Скоропадського, інженер-машинобудівник та електротехнік, Верховний отаман Січових організацій, лідер гетьманського руху у світі."],
["Князь Данило I Негош-Петрович (1826–1860)","Перший світський князь Чорногорії; «Законник Данила I»; перемога при Граховаці (1858)."]]),
B("Українська та світова Література","⟡",[
["Галицько-Волинський літопис (XIII ст.)","Перша й найбільша частина — «Літописець Данила Галицького»: описи обладунків, коня, зброї й промов («Чи не вбоїмося ми крижевників?..»)."],
["Гоголь — «Страшна помста» (1832)","Козацький сотник пан Данило Бурульбаш — лицарська доблесть, вірність побратимам, любов до землі над Дніпром."],
["Шевченко — «Гайдамаки» (1841)","У розділі «Титар» — образ мліївського титаря (прототип Данило Кушнір), що приймає мученицьку смерть, не зрікшись віри."],
["Іван Франко","Розвідки та поетичні рядки про короля Данила, Данила Братковського й Данила Паломника."],
["Яновський — «Вершники» (1935)","У «Шаланді в морі» та «Подвійному колі» Данило Чабан — незламний степовий ватажок."],
["Бажан — «Данило Галицький» (1942)","Героїчна поема про битву під Дорогочином 1238 як символ непереможності духу."],
["Хижняк — «Данило Галицький» (1951)","Епічний роман про пів століття Русі: від Калки до заснування Львова та коронації."],
["Гончар — «Тронка» (1963, Шевченківська премія)","Капітан далекого плавання Данило Ягнич (також у «Березі любові») — людина честі й морської романтики."],
["Загребельний — «Диво» (1968), «Смерть у Києві» (1972)","Носії імені Данило — охоронці давньої мудрості й майстерності."],
["Стельмах","«Кров людська — не водиця»: Данило Бондаренко — взірець гуманізму й совісті. Також «Хліб і сіль», «Правда і кривда», «Дума про тебе»."],
["Шкляр — «Чорний Ворон. Залишенець» (2009)","Згадано звитяги Дніпровської дивізії отамана Зеленого (Данила Терпила)."],
["Пісня про Нечая","«Ой з-за гори та ще й з-за лиману» («Ой п’є Нечай та мед-горілочку») оспівує останній бій Данила Нечая."]]),
B("Наука, Культура, Спорт та Кіберспорт","⬡",[
["Наука та медицина","Данило Самойлович (1744–1805) — засновник української епідеміології, член 12 академій, рятівник Півдня від чуми. Данило Заболотний (1866–1929) — президент ВУАН (1928–1929), випробовував вакцини на собі, переміг осередки чуми й холери на чотирьох континентах. Данило Воронцов (1886–1965) — електрофізіолог, академік АН УРСР, творець школи нейрофізіології. Данило Граве та Київська алгебраїчна школа."],
["Культура, кіно, живопис, медіа","Данило Щербаківський (1877–1927) — археолог, мистецтвознавець. Данило Демуцький (1893–1954) — оператор «Землі» Довженка. Данило Нарбут (1916–1998) — Народний художник, шевченківський лауреат, цикли про гетьманів. Данило Лідер (1917–2002) — патріарх сценографії (театр Франка). Данило Перцов (1973–2021) — «Хорея Козацька». Данило Яневський (нар. 1956) — доктор історичних наук, телеведучий."],
["Футбол та спорт","Данило Сікан (нар. 2001) — чемпіон світу U-20 (2019), «Срібний бутса». Данило Бескоровайний (нар. 1999) — чемпіон світу U-20, «Кривбас» і «Полісся». Данило Ігнатенко (нар. 1997) — збірна й «Бордо». Данило Колесник і Данило Кравчук (обидва нар. 2001). Данило Болдирєв (нар. 1992) — скелелаз, чемпіон світу (2014) і Європи (2020), рекорд 5,60 с на 15 м."],
["Кіберспорт","Данило «Zeus» Тесленко (нар. 1987) — легенда CS, капітан Natus Vincere, переможець PGL Major Kraków 2017. Данило «Dendi» Ішутін (нар. 1989) — Dota 2, переможець The International 2011 у складі NaVi, засновник B8."],
["Світові генії: Даніель","Даніель Дефо (1660–1731) — «Робінзон Крузо». Даніель Бернуллі (1700–1782) — закон Бернуллі. Даніель Габріель Фаренгейт (1686–1736) — термометр і шкала. Даніель Резерфорд (1749–1819) — відкривач азоту. Деніел Канеман (1934–2024) — Нобель з економіки. Деніел Ек (нар. 1983) — Spotify. Редкліфф, Крейг, Дей-Льюїс, Брюль — кіно. Даніел Ріккардо — Формула-1, 8 Гран-прі."]]),

function mk(k,n,s,c,o,ch,pe,li){N[k]={n:n,s:s,c:c,br:[B("Походження та значення","◈",[["Походження та значення",o]]),B("Код характеру","❖",[["Код характеру",ch]]),B("Історичні постаті та знаменитості","✦",pe.map(x=>x.split("|"))),B("Образ у літературі та культурі","⟡",[["Образ у літературі та культурі",li]])]}}
mk("sonia","СОНЯ","Софія • Мудрість","#ff7eb6","Від давньогрецького Σοφία (Софія): «мудрість», «розумність», «премудрість». У пестливій формі «Соня» асоціюється також із Сонцем, світлом і теплом.","Інтуїтивна, творча, має блискучий смак, поєднує ніжність із аналітичним розумом і вмінням бачити людей наскрізь.",["Софія Київська (XI ст.)|Головна святиня й символ мудрості держави Ярослава Мудрого.","Софія Русова (1856–1940)|Педагогиня, письменниця, одна із засновниць сучасної української освіти.","Софія Окуневська-Морачевська (1865–1926)|Перша жінка-лікарка в Австро-Угорщині та Західній Україні, подруга Кобилянської.","Софія Яблонська (1907–1971)|Мандрівниця, фотографка, письменниця; у 1930-х сама об’їхала Марокко, Китай, Індокитай та острови Океанії з кінокамерою.","Софія Караффа-Корбут (1924–1996)|Художниця-графік, ілюстраторка «Лісової пісні» та «Кобзаря».","Софія Ковалевська (1850–1891)|Перша у світі жінка — професорка математики."],"Софія Дорошенко у драмі Лесі Українки «Бояриня»; Софія в новелах Ольги Кобилянської («Меланхолійний вальс»); Соня Мармеладова — символ самопожертви.");
mk("artur","АРТУР","Ведмідь • Зірка","#4cc9f0","Кельтське (валлійське) та римське коріння: «Artos» — «ведмідь» (символ королівської сили) або зірка Арктур (Ἀρκτοῦρος — «охоронець ведмедиці»). «Могутній як ведмідь», «кам’яна скеля», «благородний лицар».","Харизматичний лідер, цінує стиль, технології, свободу й вірність друзям; прагне бути першим у справі.",["Король Артур (V–VI ст.)|Вождь бритів, меч Екскалібур, Лицарі Круглого столу, Камелот.","Артур Рудницький (1912–2002)|Піаніст, диригент, музикознавець і композитор.","Артур Новаковський|Сучасні діячі науки та ІТ.","Артур Алексанян, Артур Айвазян|Айвазян — олімпійський чемпіон зі стрільби 2008 у складі збірної України.","Артур Конан Дойл (1859–1930)|Творець Шерлока Холмса.","Артур Кларк (1917–2008)|Фантаст і футуролог («Космічна одіссея 2001 року»), у 1945 передбачив супутниковий зв’язок та інтернет.","Артур Шопенгауер (1788–1860)|Німецький філософ."],"Цикл про Артура (Мелорі, «Смерть Артура»); Артур Бертон — герой «Овода» Етель Войнич; Артур Дент — «Путівник Галактикою для космотуристів» Дугласа Адамса.");
mk("hlib","ГЛІБ","Спадкоємець Бога","#2de2c3","Давньоскандинавське княже ім’я Guðleifr (Гудлейфр): «Guð» (Бог) + «leifr» (спадкоємець). «Спадкоємець Бога», «Улюбленець долі».","Надійний як граніт, спокійний у критичних ситуаціях, має чудову реакцію (ідеально для динамічних ігор і кіберспорту), вірний друг і стратег.",["Князь Гліб Володимирович (бл. 987–1015)|Син Володимира Великого, князь муромський, один із перших канонізованих святих Русі разом із Борисом.","Князь Гліб Юрійович (†1171)|Великий князь київський і князь переяславський.","Гліб Івакін (1947–2018)|Археолог, заступник директора Інституту археології НАН України, дослідник Києва й Золотих воріт.","Гліб Лазаревський (1877–1949)|Літературознавець, мемуарист, дослідник Шевченка.","Гліб Бабіч (1969–2022)|Поет, автор пісні «Подай зброю» (Kozak System), військовий.","Гліб Котельников (1872–1944)|Винахідник авіаційного ранцевого парашута (1911)."],"«Сказання про Бориса і Гліба» (XI ст.) — перша оригінальна агіографічна пам’ятка Русі; образи княжичів у романах Раїси Іванченко й Павла Загребельного.");
mk("kyrylo","КИРИЛО","Володар • Сонце","#ffb347","Від грецького Κύριλλος (від «кюріос» — «володар») або давньоперського «Kuruš» — «Сонце».","Енциклопедична пам’ять, лідерські амбіції, гострий розум і гумор; природжений оратор і керівник.",["Святий Кирило Філософ (827–869)|Просвітитель, творець слов’янської абетки (глаголиці та основи кирилиці).","Кирило Кожум’яка|Київський богатир часів Володимира, голіруч переміг Змія; урочище Кожум’яки.","Кирило Розумовський (1728–1803)|Останній гетьман (1750–1764), президент Академії наук у 18 років, палаци в Батурині й Глухові.","Кирило Стеценко (1882–1922)|Композитор, хоровий диригент, сподвижник Леонтовича.","Кирило Осьмак (1890–1960)|Президент УГВР (1944).","Кирило Синельников (1901–1966)|Фізик-ядерник, академік, ХФТІ, де вперше розщеплено ядро літію.","Кирило Буданов (нар. 1986)|Генерал-лейтенант, начальник ГУР МОУ, Герой України.","Кирило Фесенко (нар. 1986)|Баскетболіст, НБА («Юта Джаз», «Індіана Пейсерз»)."],"Казка-легенда «Кирило Кожум’яка» й поема Олександра Олеся «Микита Кожум’яка»; отаман Кирило Тур у «Чорній раді» Куліша (1857).");
mk("masha","МАША","Марія • Бажана","#b388ff","Від давньоєврейського Міріам (מִרְיָם): «бажана», «улюблена», «пані / володарка».","Енергійна, щира, з сильним почуттям гідності, надихає й веде за собою в творчих проєктах.",["Марія Заньковецька (1854–1934)|Королева української сцени, перша Народна артистка України (1922).","Марія Примаченко (1909–1997)|Художниця «наївного мистецтва», «фантастичні звірі», ними захоплювався Пікассо.","Марія Башкирцева (1858–1884)|Українсько-французька художниця; картини в Луврі й Музеї Орсе, «Щоденник» — світовий бестселер.","Марко Вовчок (Марія Вілінська, 1833–1907)|Авторка «Інститутки» та «Марусі» (відзнака Французької академії).","Марія Склодовська-Кюрі (1867–1934)|Двічі лауреат Нобелівської премії, радій і полоній.","Маша Єфросиніна|Телеведуча, Почесний посол ООН."],"Маруся Чурай — «Маруся Чурай» Ліни Костенко; Марія у Шевченка та в романі Уласа Самчука «Марія».");
mk("milana","МІЛАНА","Мила • Гармонія","#ff6b9d","Давньослов’янське ім’я від кореня «мил-» (люба, привітна, та, що дарує милість і гармонію), співзвучне з Міланом (Mediolanum — «у центрі рівнини»).","Яскрава, артистична, дипломатична, любить естетику, подорожі й тренди; перетворює будь-яку ідею на красивий результат.",["Королева Мілана Обренович|Представниця балканських княжих династій.","Мілана Князевич|Сучасні українські спортсменки художньої гімнастики, тенісу, фігурного катання.","Мілана Вайнтруб (Milana Vayntrub)|Американська акторка, режисерка й активістка зі Східної Європи."],"Образ княжни Мілани у слов’янських історичних баладах і європейській фентезі-прозі як символ світла, що зупиняє ворожнечу.");
mk("varia","ВАРЯ","Варвара • Унікальна","#ff9f43","Від грецького βάρβαρος (barbaros) — «іноземна», «унікальна», «не схожа на інших»; так називали вільних, гордих людей півночі.","Смілива, рішуча, має власну думку, творча бунтарка з добрим серцем і працездатністю.",["Свята Варвара Іліопольська (III–IV ст.)|Мощі понад 900 років у Києві (Михайлівський Золотоверхий монастир, нині Володимирський собор).","Варвара Ханенко (1852–1922)|Колекціонерка, меценатка, співзасновниця Музею Ханенків у Києві.","Варвара Рєпніна (1808–1891)|Княжна з роду Розумовських, письменниця, друг Шевченка (поема «Тризна»).","Варвара Карінська (1886–1983)|Художниця по костюмах із Харкова, «Оскар» (1948), авторка сучасної форми балетної пачки."],"Сміливі героїні на ім’я Варя в українській драматургії XX століття та пригодницькій літературі.");
mk("nonna","НОННА","Свята • Дев’ята","#7bed9f","Рідкісне аристократичне ім’я: 1) «присвячена Богу», «чиста», «свята» (давньоєгипетське та грецьке коріння); 2) латинське «Nona» (дев’ята) — богиня долі, що пряла нитку життя й відповідала за щасливе народження.","Унікальна індивідуальність, незалежна, харизматична, має сильний внутрішній стрижень і магнетичний характер.",["Свята Нонна Назіанська (IV ст.)|Мати Григорія Богослова, відома мудрістю й милосердям.","Нонна Копержинська (1920–1999)|Народна артистка України («За двома зайцями», «Королева бензоколонки»).","Нонна Суржина (нар. 1937)|Оперна співачка (мецо-сопрано), Народна артистка, шевченківська лауреатка, Дніпровський театр опери та балету.","Нонна Гапріндашвілі (нар. 1941)|Грузинська шахістка, п’ятиразова чемпіонка світу, перша жінка-гросмейстер серед чоловіків (1978)."],"Героїні античних хронік та інтелектуальної прози XX століття.");
mk("anya","АНЯ","Анна • Ганна • Благодать","#5ea8ff","Від давньоєврейського Ханна (חַנָּה): «благодать», «грація», «милість Божа», «хоробрість». В Україні співіснують форми Анна та Ганна (Аня, Анюта, Ганнуся).","Гармонійна, уважна до деталей, з витонченим інтелектом, вірна слову, об’єднує людей навколо спільних цілей.",["Анна Ярославна (бл. 1032–1075)|Донька Ярослава Мудрого, королева Франції, дружина Генріха I, мати Філіпа I; підписувала грамоти кирилицею («Ана Ръина»), привезла Реймське Євангеліє.","Ганна Барвінок (Олександра Білозерська-Куліш, 1828–1911)|Письменниця, дружина Куліша.","Ганна Собачко-Шостак (1883–1965)|Майстриня декоративного розпису; виставки в Парижі, Берліні, Мюнхені.","Анна Музичук (нар. 1990)|Шахістка-гросмейстер, триразова чемпіонка світу зі швидких шахів і бліцу.","Анна Безсонова (нар. 1984)|Абсолютна чемпіонка світу з художньої гімнастики (2007), дворазова бронзова призерка Олімпіад.","Анна Рижикова (нар. 1989)|Легкоатлетка, бронзова призерка Олімпійських ігор."],"Анна Задорожна в «Украденому щасті» Франка; Ганна в «Наймичці» Шевченка; Анна Ярославна в романах Івана Кочерги («Ярослав Мудрий») та Валентина Чемериса («Анна Київська — королева Франції»).");
mk("liza","ЛІЗА","Єлизавета • Обітниця","#c77dff","Від давньоєврейського Елішева (אֱלִישֶׁבַע): «Бог — моя клятва», «Божа обітниця». Класичне королівське ім’я Європи та України.","Дотепна, життєрадісна, з королівською поставою, гострим розумом і лідерською іскрою; легко знаходить вихід зі складних ситуацій.",["Єлизавета Ярославна (бл. 1025–1067)|Старша донька Ярослава Мудрого, королева Норвегії (дружина Гаральда Суворого) і згодом Данії.","Гальшка Острозька (1539–1582)|«Чорна княгиня», найбагатша наречена Речі Посполитої; заповіла статки на Острозьку академію (1576) — перший вищий навчальний заклад у Східній Європі.","Галшка Гулевичівна (бл. 1575–1642)|Київська шляхтянка, 1615 подарувала садибу на Подолі для Київського братського монастиря й школи — основи Києво-Могилянської академії.","Єлизавета Милорадович (1832–1890)|Меценатка з роду Скоропадських, кошти на НТШ у Львові.","Ліза Мерешко (нар. 1992)|П’ятиразова паралімпійська чемпіонка (Ріо-2016, Токіо-2020), рекордсменка світу.","Єлизавета I Тюдор та Єлизавета II Віндзорська|Монархи Великої Британії."],"Образ Гальшки Острозької в українських драмах і романах; Єлизавета Ярославна в «Диві» Загребельного та в баладах скандинавських скальдів.");
mk("liza","ЛІЗА","Єлизавета • Обітниця","#c77dff","Від давньоєврейського Елішева (אֱלִישֶׁבַע): «Бог — моя клятва», «Божа обітниця». Класичне королівське ім’я Європи та України.","Дотепна, життєрадісна, з королівською поставою, гострим розумом і лідерською іскрою; легко знаходить вихід зі складних ситуацій.",["Єлизавета Ярославна (бл. 1025–1067)|Старша донька Ярослава Мудрого, королева Норвегії (дружина Гаральда Суворого) і згодом Данії.","Гальшка Острозька (1539–1582)|«Чорна княгиня», найбагатша наречена Речі Посполитої; заповіла статки на Острозьку академію (1576) — перший вищий навчальний заклад у Східній Європі.","Галшка Гулевичівна (бл. 1575–1642)|Київська шляхтянка, 1615 подарувала садибу на Подолі для Київського братського монастиря й школи — основи Києво-Могилянської академії.","Єлизавета Милорадович (1832–1890)|Меценатка з роду Скоропадських, кошти на НТШ у Львові.","Ліза Мерешко (нар. 1992)|П’ятиразова паралімпійська чемпіонка (Ріо-2016, Токіо-2020), рекордсменка світу.","Єлизавета I Тюдор та Єлизавета II Віндзорська|Монархи Великої Британії."],"Образ Гальшки Острозької в українських драмах і романах; Єлизавета Ярославна в «Диві» Загребельного та в баладах скандинавських скальдів.");
N.milana={n:"МІЛАНА",s:"Мила • Гармонія • Натисни, щоб розкрити гілки",c:"#ff6b9d",br:[
B("Походження та значення","◈",[
["Етимологічне ядро","Мілана — слов’янське жіноче ім’я, утворене від кореня «мил-». Його основні смисли — люба, привітна, добра, та, що дарує тепло й гармонію. Ім’я передає не лише м’якість, а й внутрішню силу: здатність підтримати, домовитися та створити навколо себе атмосферу довіри."],
["Мовна форма","Українською ім’я пишеться Мілана, наголос у повсякденному мовленні найчастіше падає на другий склад. Лагідні форми: Міланка, Міланочка, Міланонька. У документах і навчальних роботах доречно використовувати повну форму — Мілана."],
["Споріднені смисли","Ім’я пов’язують із поняттями милості, доброзичливості, краси та душевної рівноваги. У символічному прочитанні це ім’я людини, яка поєднує чуйність із рішучістю і вміє перетворювати ідею на конкретний результат."]]),
B("Характер і сильні сторони","❖",[
["Емоційний інтелект","Мілана добре відчуває настрій людей, помічає деталі в спілкуванні та вміє підібрати слова підтримки. Її сила — у тактовності, уважності та здатності залишатися людяною навіть у напружених ситуаціях."],
["Творчий підхід","Для цього образу характерні любов до кольору, музики, образів, красивої подачі й нестандартних рішень. Мілана може успішно розкриватися у дизайні, медіа, мистецтві, комунікаціях, організації подій та інших сферах, де важливі смак і фантазія."],
["Лідерство без тиску","Мілана здатна вести за собою не гучністю, а прикладом, послідовністю та вмінням об’єднати людей. Вона переконує через довіру, спокій і чітке бачення мети."]]),
B("Навчання та розвиток","✦",[
["Як навчається","Найкраще сприймає матеріал, коли бачить його практичний сенс і може поєднати теорію з візуальним прикладом. Допомагають короткі плани, кольорові позначки, схеми, презентації, творчі завдання та пояснення власними словами."],
["Корисні навички","Варто розвивати грамотне мовлення, іноземні мови, цифрову грамотність, роботу з графікою, презентаціями та відео. Не менш цінні навички — планування часу, командна робота, фінансова грамотність і вміння захищати власні межі."],
["Особистий прогрес","Стабільний результат з’являється тоді, коли великі цілі розділені на невеликі кроки. Для Мілани корисно вести список ідей, щотижня обирати один пріоритет і завершувати розпочате до переходу до нового задуму."]]),
B("Стиль і самовираження","⟡",[
["Візуальний образ","Ім’я асоціюється з поєднанням ніжних і насичених відтінків: рожевого, малинового, бузкового, перлинного та теплого золотого. У дизайні це може проявлятися через м’яке світло, плавні лінії, прозорі шари й один яскравий акцент."],
["Комунікація","Мілані пасує доброзичливий, упевнений і конкретний стиль. Важливо говорити просто, не знецінювати себе та не погоджуватися на менше лише заради чужого схвалення."],
["Творча енергія","Найкращі ідеї з’являються там, де є свобода експерименту: у фотографії, малюванні, оформленні простору, танці, музиці, текстах або створенні власних цифрових проєктів."]]),
B("Дружба та взаємини","⬡",[
["У дружбі","Мілана цінує щирість, сталість і повагу до особистого простору. Вона вміє слухати, підтримувати у складний момент і радіти успіхам близьких без заздрощів."],
["У команді","Їй добре в ролі координаторки, дизайнерки ідей або людини, яка допомагає команді домовлятися. Водночас важливо не брати на себе всю відповідальність і своєчасно просити про допомогу."],
["Здорові межі","Турбота про інших не повинна перетворюватися на постійне самопожертвування. Для Мілани важливі відпочинок, особистий час, чесне «ні» та оточення, у якому її думку чують."]]),
B("Символи та асоціації","❖",[
["Кольори","Малиновий — енергія та сміливість; рожевий — тепло й турбота; бузковий — уява та інтуїція; золотий — упевненість і цінність власної праці."],
["Образи","Найкраще символічне поєднання для Мілани — світло, квітка, ранкове небо, вода та міст, який об’єднує береги. Ці образи передають красу, рух, відкритість і здатність створювати зв’язки."],
["Числовий настрій","У творчій інтерпретації ім’я можна пов’язати з числом 6 — символом гармонії, турботи, краси та відповідальності. Це не науковий прогноз, а образний спосіб описати характер імені."]]),
B("Мрії, цілі та майбутнє","◈",[
["Внутрішня мотивація","Мілану надихає можливість зробити світ красивішим, зрозумілішим і добрішим. Їй важливо бачити, що її робота приносить користь, дає людям емоцію або допомагає знайти рішення."],
["Формула успіху","Поєднання смаку, дисципліни й допитливості відкриває багато напрямів: креативні індустрії, освіта, комунікації, підприємництво, технології, культура та соціальні ініціативи."],
["Довгострокове бачення","Найсильніший результат для Мілани — власний проєкт або справа, у якій є особистий стиль. Її шлях може починатися з маленьких експериментів, портфоліо, навчання й поступово вирости у впізнаваний бренд."]]),
B("Підсумковий портрет","✦",[
["Головна риса","Мілана — це поєднання м’якості та характеру. Вона може бути уважною до людей, але водночас наполегливою у важливих рішеннях; любити красу, але не боятися складної роботи; мріяти масштабно й рухатися до мети крок за кроком."],
["Надихаюча фраза","«Моя доброта — це сила, моя уява — це напрям, а кожен завершений крок наближає мене до власної мрії»."],
["Коротка характеристика","Мілана — творча, чуйна, дипломатична, цілеспрямована й відкрита до нового. Її особливість — уміння бачити красу в деталях і перетворювати натхнення на результат."]])
]};
const ORD=["milana"],$=s=>document.querySelector(s);
let cur="milana",opened=false,ai=-1,nodes=[],lines=[],mouse={x:-9,y:-9};
// menu
const nm=$("#nm");nm.innerHTML=ORD.map(k=>"<button data-k='"+k+"'>"+N[k].n+"</button>").join("");
nm.onclick=e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){setName(k);nm.classList.remove("show")}};
$("#back").onclick=()=>setName("milana");
// theme
$("#th").onclick=()=>{const l=document.body.dataset.th!="light";document.body.dataset.th=l?"light":"dark";$("#th").textContent=l?"◈ Темна тема":"✧ Світла тема"};
// aurora
const cv=$("#bg"),cx=cv.getContext("2d");let W,H,P=[],t=0;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener("resize",rs);
for(let i=0;i<80;i++)P.push({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.4,s:Math.random()*.0003+.0001});
addEventListener("pointermove",e=>{mouse.x=e.clientX;mouse.y=e.clientY});
(function f(){t+=.008;const L=document.body.dataset.th=="light";cx.globalCompositeOperation="source-over";cx.fillStyle=L?"#f4f6fb":"#060814";cx.fillRect(0,0,W,H);
cx.globalCompositeOperation=L?"multiply":"lighter";const cs=L?["#9bb4ff","#c9b6ff","#a0f0e0","#ffe3a0"]:["#4cc9f0","#7b2ff7","#2de2c3","#6c7bff"];
cs.forEach((c,k)=>{const g=cx.createLinearGradient(0,0,0,H*.8);g.addColorStop(0,"transparent");g.addColorStop(.5,c+(L?"88":"33"));g.addColorStop(1,"transparent");cx.fillStyle=g;cx.beginPath();cx.moveTo(0,H);for(let x=0;x<=W;x+=24)cx.lineTo(x,H*(.35+k*.09)+Math.sin(x*.004+t*(1+k*.3)+k)*H*.12+Math.sin(x*.011-t)*H*.04);cx.lineTo(W,H);cx.fill()});
cx.globalCompositeOperation="source-over";cx.fillStyle=L?"#5a6bd0":"#fff";P.forEach(p=>{p.y=(p.y-p.s+1)%1;let x=p.x*W,y=p.y*H;const dx=x-mouse.x,dy=y-mouse.y,d=Math.hypot(dx,dy);if(d<120){x+=dx/d*(120-d)*.4;y+=dy/d*(120-d)*.4}cx.globalAlpha=.4+.4*Math.sin(t*3+p.x*9);cx.beginPath();cx.arc(x,y,p.r,0,7);cx.fill()});cx.globalAlpha=1;requestAnimationFrame(f)})();
// map
const world=$("#world"),svg=$("#lines"),ns="http://www.w3.org/2000/svg";
function build(){nodes.forEach(o=>o.n.remove());svg.innerHTML="";nodes=[];lines=[];const D=N[cur].br,R=Math.min(330,innerWidth*.38+60);
D.forEach((b,i)=>{const a=(-90+360/D.length*i)*Math.PI/180,x=Math.cos(a)*R,y=Math.sin(a)*R*.85;
const n=document.createElement("div");n.className="nd";n.innerHTML="<span>"+b.g+"</span>"+"Гілка "+(i+1)+": "+b.t;n.style.left="0";n.style.top="0";n.onclick=e=>{e.stopPropagation();sel(i)};world.append(n);nodes.push({n,x,y});
const d="M0 0Q"+(x/2-y*.25)+" "+(y/2+x*.25)+" "+x*.86+" "+y*.86,p=document.createElementNS(ns,"path");p.setAttribute("d",d);p.setAttribute("class","ln");p.style.stroke="var(--c)";p.style.color="var(--c)";svg.append(p);
const q=document.createElementNS(ns,"path");q.setAttribute("d",d);q.setAttribute("class","pl");q.style.animationDelay=-i*.4+"s";q.style.opacity=0;q.style.transition="opacity .6s";svg.append(q);lines.push([p,q])});
world.classList.remove("open");opened=false}
function setName(k){cur=k;const o=N[k];document.documentElement.style.setProperty("--c",o.c);$("#on").textContent=o.n;$("#os").textContent=o.s;$("#orb").style.transform="scale(.85)";setTimeout(()=>$("#orb").style.transform="",400);$("#back").style.display="none";close();build();toggle()}
function ripple(){const r=document.createElement("div");r.className="rip";world.append(r);setTimeout(()=>r.remove(),1300)}
function toggle(){opened=!opened;world.classList.toggle("open",opened);nodes.forEach(o=>{o.n.style.left=opened?o.x+"px":"0";o.n.style.top=opened?o.y+"px":"0"});lines.forEach(l=>l[1].style.opacity=opened?.9:0);ripple();if(!opened)close()}
$("#orb").onclick=e=>{e.stopPropagation();if(!moved)toggle()};
function hl(s,q){return q?s.replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>"):s}
function rend(el,list,q){q=q.trim().toLowerCase();let h="",pk="";list.forEach(([k,i])=>{const o=N[k],b=o.br[i],c=b.it.filter(x=>!q||(x[0]+x[1]+b.t+o.n).toLowerCase().includes(q));if(!c.length)return;
if(list.length>6&&k!=pk){h+="<h1 style='color:"+o.c+"'>◈ "+o.n+"</h1>";pk=k}
h+="<h2 style='--c:"+o.c+"'>"+b.g+" "+b.t+"</h2>"+c.map(x=>"<div class='card' style='--c:"+o.c+"'><h3>"+hl(x[0],q)+"</h3><p>"+hl(x[1],q)+"</p></div>").join("")});el.innerHTML=h||"<p>Нічого не знайдено.</p>"}
function sel(i){lines.forEach((l,k)=>l[0].classList.toggle("act",k==i));nodes.forEach((o,k)=>o.n.classList.toggle("act",k==i));rend($("#dc"),[[cur,i]],"");$("#dr").classList.add("show")}
function close(){$("#dr").classList.remove("show");lines.forEach(l=>l[0].classList.remove("act"));nodes.forEach(o=>o.n.classList.remove("act"))}
$("#x").onclick=close;

$("#v1").onclick=()=>view(0);$("#v2").onclick=()=>view(1);

document.addEventListener("click",e=>{if(!nm.contains(e.target))nm.classList.remove("show")});

const st=$("#stage");
st.onpointerdown=e=>{ps[e.pointerId]={x:e.clientX,y:e.clientY};moved=false;sd=0;if(Object.keys(ps).length==2){const v=Object.values(ps);sd=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)}};
st.onpointermove=e=>{const p=ps[e.pointerId];if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
if(Object.keys(ps).length==2){const v=Object.values(ps),d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);if(sd)sc=Math.max(.35,Math.min(2.2,sc*d/sd));sd=d;moved=true}else{if(Math.abs(dx)+Math.abs(dy)>2)moved=true;tx+=dx;ty+=dy}ap()};
