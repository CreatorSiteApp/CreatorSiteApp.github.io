function setH1(t){const h=$('#h1');h.textContent='';t.split(' ').forEach((w,i)=>{const s=document.createElement('span');s.textContent=w;s.style.animationDelay=i*.1+'s';h.append(s,' ')})}
function apply(){const d=T[L];document.documentElement.lang=L;document.title=d.title;
document.querySelectorAll('[data-i]').forEach(e=>{const k=e.dataset.i;if(k==='h1')setH1(d.h1);else e.textContent=d[k]});
$('#chatIn').placeholder=d.chatPh;document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));
const m=document.querySelector('meta[name=description]');m.content=L==='uk'?'Створюю сайти в стилі macOS. Швидко й чітко. Оплата криптою або карткою українського банку.':'I build websites in macOS style. Fast and precise. Pay by crypto or Ukrainian bank card.';
resetChat()}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('lang',L)}catch(e){}apply()});
const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.12});
document.querySelectorAll('.rv').forEach(e=>io.observe(e));
const st=$('#stage'),sk=$('#stack');
st.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const r=st.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;requestAnimationFrame(()=>{sk.style.setProperty('--ry',x*28+'deg');sk.style.setProperty('--rx',-y*28+'deg')})});
st.addEventListener('pointerleave',()=>{sk.style.removeProperty('--rx');sk.style.removeProperty('--ry')});
/* ---- chat ---- */
const log=$('#chatLog'),inp=$('#chatIn'),box=$('#chat');let hist=[];
$('#chatBtn').onclick=()=>box.classList.toggle('open');
const tg=t=>'https://t.me/SiteCreatorCom?text='+encodeURIComponent(t);
function add(t,me){const d=document.createElement('div');d.className='m '+(me?'me':'bot');d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function chips(items){const o=log.querySelector('.qrs');if(o)o.remove();const w=document.createElement('div');w.className='qrs';
items.forEach(it=>{let e;if(it.href){e=document.createElement('a');e.href=it.href;e.target='_blank';e.rel='noopener'}else{e=document.createElement('button');e.onclick=()=>{add(it.label,true);answer(it.key)}}
e.className='qr'+(it.p?' p':'');e.textContent=it.label;w.appendChild(e)});log.appendChild(w);log.scrollTop=log.scrollHeight}
const KEYS=['order','price','pay','get','process','why'];
function topics(except){const d=T[L];return KEYS.filter(k=>k!==except&&k!=='order').map(k=>({label:d['q_'+k],key:k}))}
function answer(k){const d=T[L];
if(k==='order'){add(d.a_order);chips([{label:d.tgOrder,href:tg(d.pre1),p:1},{label:d.tgPrice,href:tg(d.pre2)},{label:d.tgPay,href:tg(d.pre3)}].concat(topics('order').slice(0,2)))}
else if(k==='none'){add(d.a_none);chips([{label:d.tgOrder,href:tg(d.pre1),p:1}].concat(topics()))}
else{add(d['a_'+k]);chips([{label:d.tgOrder,href:tg(d.pre1),p:1}].concat(topics(k)))}}
function resetChat(){log.textContent='';hist=[];add(T[L].greet);chips(KEYS.map(k=>({label:T[L]['q_'+k],key:k,p:k==='order'})))}
function intent(q){q=q.toLowerCase();
if(/замов|хочу|купит|купи|order|buy|want to|хотів|хотел/.test(q))return'order';
if(/цін|ціна|ціни|скільки|варт|коштує|price|cost|how much|цен|сколько|стоит/.test(q))return'price';
if(/оплат|крипт|картк|карт|гривн|передопл|pay|crypto|card|uah|предоплат/.test(q))return'pay';
if(/zip|архів|отрим|що я|receive|deliver|get|хостинг|платформ|host|platform|архив|получ/.test(q))return'get';
if(/як проход|етап|процес|порядок|how.*work|process|steps|как проход/.test(q))return'process';
if(/чому|чим кращ|why|better|вибрати|choose|почему|выбрат/.test(q))return'why';return null}
async function send(){const q=inp.value.trim();if(!q)return;inp.value='';add(q,true);
const k=intent(q);if(k){answer(k);return}
hist.push({role:'user',content:q});const w=add('…');let a='';
try{const c=new AbortController();setTimeout(()=>c.abort(),15000);
const r=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'openai',messages:[{role:'system',content:T[L].sys}].concat(hist.slice(-6))}),signal:c.signal});
const j=await r.json();a=(j.choices[0].message.content||'').trim()}catch(e){}
const bad=L==='uk'?/[ыэъё]/i.test(a):/[а-яіїєґ]/i.test(a);
if(!a||bad||a.length>600){w.remove();answer('none');return}
w.textContent=a;hist.push({role:'assistant',content:a});chips([{label:T[L].tgOrder,href:tg(T[L].pre1),p:1}].concat(topics().slice(0,3)))}
$('#chatSend').onclick=send;inp.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
apply();
</script></body></html>
